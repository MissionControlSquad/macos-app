# Dependabot version updates. Security updates are enabled separately in
# Settings → Code security and use the same configuration.
# The Xcode project has no Swift package dependencies yet; add a "swift" entry if it gains any.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "github-actions"]
    groups:
      actions:
        patterns: ["*"]
